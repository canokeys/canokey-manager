[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/canokeys/canokey-manager"

[workspace.dependencies]
canokey = { version = "0.1.3", features = ["x509", "clientpin"] }

base64ct = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.2"
curve25519-dalek = "4.1.3"
der = { version = "0.7", features = ["derive", "oid"] }
fips203 = { version = "0.5", default-features = false, features = ["ml-kem-768"] }
fips204 = { version = "0.5", default-features = false, features = ["ml-dsa-65"] }
getrandom = { version = "0.3", features = ["std"] }
hmac = "0.12"
hidapi = "2.6"
keyring = "3"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
p256 = { version = "0.13", features = ["pkcs8"] }
p384 = { version = "0.13", features = ["pkcs8"] }
p521 = { version = "0.13", default-features = false, features = ["arithmetic"] }
pbkdf2 = "0.12"
pkcs1 = "0.7"
# Import existing PBES2 files using the RFC 8018 default PRF, HMAC-SHA1.
pkcs5 = { version = "0.7", features = ["sha1-insecure"] }
pkcs8 = { version = "0.10", features = ["encryption"] }
pcsc = "2.9"
rsa = "0.9"
rpassword = "7"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
spki = "0.7"
sm2 = { version = "0.13", default-features = false, features = ["arithmetic"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "=0.1.25"
x509-cert = "0.2"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
