[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/canokeys/canokey-manager"

# libcanokey is pinned to the codex/oath-admin-migration branch, the only
# branch carrying canokey-ctap and canokey-ndef. Switch to a main tag once
# the branch merges.
[workspace.dependencies]
canokey = { git = "https://github.com/canokeys/libcanokey.git", rev = "f94f40acaf5bb57906d2edab1fd1b73d0cfdd97e", features = ["x509", "clientpin"] }
canokey-ctap = { git = "https://github.com/canokeys/libcanokey.git", rev = "f94f40acaf5bb57906d2edab1fd1b73d0cfdd97e" }

base64ct = "1"
clap = { version = "4.5", features = ["derive"] }
der = { version = "0.7", features = ["derive", "oid"] }
getrandom = { version = "0.3", features = ["std"] }
hidapi = "2.6"
keyring = "3"
p256 = { version = "0.13", features = ["pkcs8"] }
p384 = { version = "0.13", features = ["pkcs8"] }
pbkdf2 = "0.12"
pkcs1 = "0.7"
pkcs8 = { version = "0.10", features = ["encryption"] }
pcsc = "2.9"
rsa = "0.9"
rpassword = "7"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
spki = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-cert = "0.2"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
