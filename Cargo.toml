[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/canokeys/canokey-manager"

# libcanokey from crates.io (canokey 0.1.0 includes canokey-ctap/canokey-ndef).
[workspace.dependencies]
canokey = { version = "0.1.0", features = ["x509", "clientpin"] }

base64ct = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.2"
der = { version = "0.7", features = ["derive", "oid"] }
getrandom = { version = "0.3", features = ["std"] }
hmac = "0.12"
hidapi = "2.6"
keyring = "3"
p256 = { version = "0.13", features = ["pkcs8"] }
p384 = { version = "0.13", features = ["pkcs8"] }
pbkdf2 = "0.12"
pkcs1 = "0.7"
pkcs5 = "0.7"
pkcs8 = { version = "0.10", features = ["encryption"] }
pcsc = "2.9"
rsa = "0.9"
rpassword = "7"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
spki = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-cert = "0.2"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
