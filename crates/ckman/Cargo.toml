[package]
name = "ckman"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/canokeys/canokey-manager"
description = "ckman: CanoKey management CLI"
readme = "../../README.md"
keywords = ["canokey", "security-key", "fido2", "openpgp", "piv"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "ckman"
path = "src/main.rs"

[dependencies]
canokey.workspace = true
ckman-core = { path = "../ckman-core", version = "0.1.0" }
ckman-transport = { path = "../ckman-transport", version = "0.1.0" }
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
getrandom.workspace = true
hidapi.workspace = true
p256.workspace = true
p384.workspace = true
rsa.workspace = true
keyring.workspace = true
rpassword.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
