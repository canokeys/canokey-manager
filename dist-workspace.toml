# cargo-dist configuration for GitHub-release builds of the `ckman` binary.
#
# The build matrix covers macOS (aarch64/x64), Windows x64, and Linux
# x64/aarch64. PC/SC and hidapi are system dependencies on all targets;
# release builds need pcsclite/udev headers on Linux (see
# [dist.dependencies.apt]). The release workflow is generated by
# `dist generate` (via `dist init`) and committed at
# .github/workflows/release.yml.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The installers to generate for each release
installers = ["shell", "powershell", "pkg"]
# Target platforms to build apps for (Rust target-triple syntax).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Only the CLI package ships (ckman-mangen is a dev tool).
packages = ["ckman"]
# Publish jobs run from tags named v*.
tag-namespace = "v"
# The preferred dist version to use in CI (pinned by `dist init`)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"

# System packages needed to build on Linux (PC/SC and hidapi/udev headers).
[dist.dependencies.apt]
libpcsclite-dev = '*'
libudev-dev = '*'

# macOS .pkg installer identity.
[dist.mac-pkg-config]
identifier = "org.canokeys.ckman"
