# Publishes each GitHub release to the Windows Package Manager (winget).
#
# Requires:
# - a fork of microsoft/winget-pkgs at canokeys/winget-pkgs
# - a WINGET_TOKEN secret: a classic PAT with public_repo + workflow scopes
name: Publish to WinGet

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release-tag:
        description: GitHub release tag to publish to WinGet
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Canokeys.Ckman
          release-tag: ${{ inputs.release-tag || github.event.release.tag_name }}
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
