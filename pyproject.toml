[project]
name = "canokey-manager"
version = "5.9.2"
description = "Tool for managing your CanoKey configuration."
authors = [
  { name = "Dain Nilsson", email = "<dain@yubico.com>" },
  { name = "Yuxiang Zhang", email = "yuxiang.zhang@tuna.tsinghua.edu.cn" }
]
readme = "README.adoc"
requires-python = ">=3.10, <4"
license = { file = "COPYING" }
keywords = ["canokey", "piv", "fido"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Security :: Cryptography",
  "Topic :: Utilities"
]
dependencies = [
  "cryptography (>=3.0, <52)",
  "pyscard (>=2.0, <3)",
  "fido2 (>=2.0, <3)",
  "click (>=8.0, <9)",
  "keyring (>=23.4, <26)",
  "pywin32 (>=223) ; sys_platform == 'win32'",
  "python-pskc (>=1.3, <2)",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "makefun>=1.9.5,<2",
    "pyinstaller>=6.10,<7",
    "sphinx>=7.4,<8",
    "sphinx-rtd-theme>=3,<4",
    "sphinx-autoapi>=3.3.3,<4",
]

[project.urls]
Homepage = "https://github.com/canokeys/yubikey-manager"

[project.scripts]
ckman = "ykman._cli.__main__:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.0"
include = [
  { path = "COPYING", format = "sdist"},
  { path = "NEWS", format = "sdist"},
  { path = "README.adoc", format = "sdist"},
  "man/",
  "tests/",
]
packages = [
  { include = "yubikit" },
  { include = "ykman" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["E", "I", "S"]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["tests/", "docs/"]
reportPrivateImportUsage = false

[tool.ty.src]
exclude = ["docs"]

[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
